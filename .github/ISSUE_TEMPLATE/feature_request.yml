name: Feature request
description: Suggest a change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The tool has a narrow job: one screen, one keypress, nothing to think
        about mid-call. Features that add a decision during the interview are
        usually declined. Say what fails today.
  - type: textarea
    id: problem
    attributes:
      label: What goes wrong today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd change
    validations:
      required: true
